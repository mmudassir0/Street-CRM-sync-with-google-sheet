name: Weekly Street CRM to Google Sheets Sync

on:
  schedule:
    # Runs every Saturday at 23:00 UTC (after close of business Saturday)
    - cron: '0 23 * * 6'
  # Allows manual triggers anytime from GitHub Actions tab
  workflow_dispatch:

jobs:
  sync-data:
    name: Sync Street CRM to Branch Google Sheets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Weekly Sync
        env:
          STREET_API_KEY: ${{ secrets.STREET_API_KEY }}
          STREET_API_BASE_URL: ${{ secrets.STREET_API_BASE_URL || 'https://street.co.uk/open-api/v1' }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_JSON }}
        run: npm run sync:branches
